    source_type: ADS

  - query: "What are the requirements for code review before merging an ADS PR?"
    expected_terms:
      - "Airflow"
      - "SQA"
      - "Jira"
    source_type: ADS

  - query: "How do I release ADS changes as part of the FDR process?"
    expected_terms:
