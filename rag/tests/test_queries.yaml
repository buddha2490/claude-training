  - query: "What is the difference between Enriched and Essentials ADS?"
    expected_terms:
      - "Enriched"
      - "Essentials"
    source_type: ADS

  - query: "Are the ADS de-identified or identified? What is the difference?"
    expected_terms:
      - "de-identified"
      - "PHI"
      - "identified"
