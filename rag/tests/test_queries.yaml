# Test queries for validating RAG retrieval quality
# Run with: python scripts/validate_index.py

queries:
  - query: "What are the valid CDISC controlled terminology values for AEOUT?"
    expected_terms:
      - "RECOVERED/RESOLVED"
      - "RECOVERING/RESOLVING"
      - "NOT RECOVERED/NOT RESOLVED"
      - "RECOVERED/RESOLVED WITH SEQUELAE"
      - "FATAL"
      - "UNKNOWN"
    source_type: cdisc-ct

  - query: "What is the MedDRA preferred term for pneumonitis?"
    expected_terms:
      - "Pneumonitis"
      - "10035742"
    source_type: meddra

  - query: "What is the CTCAE grade 3 definition for pneumonitis?"
    expected_terms:
      - "Grade 3"
      - "oxygen"
    source_type: ctcae

  - query: "What is pembrolizumab?"
    expected_terms:
      - "Keytruda"
      - "PD-1"
    source_type: rxnorm

  - query: "What defines a partial response in RECIST 1.1?"
    expected_terms:
      - "30%"
      - "decrease"
    source_type: recist

# ---------------------------------------------------------------------------
# ADS Documentation
# ---------------------------------------------------------------------------

  - query: "What is an analytical dataset and how is it structured?"
    expected_terms:
      - "wide"
      - "single row per patient"
      - "tidy"
